<main class="relative bg-[#050505]">
  
  <div class="fixed inset-0 w-full h-screen z-0 bg-[#232b1e]">
    <div id="mask-container" class="w-full h-full bg-[#050505]" [style.--mask-size]="isLoggedIn ? '4000vmax' : '35vh'">
      <img src="/assets/images/museo/museo.jpg" class="w-full h-full object-cover opacity-80" alt="Fondo" />
      <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(0,0,0,0.2)_0%,rgba(0,0,0,0.85)_100%)]"></div>
      
      <div id="logo-blanco-overlay" class="absolute inset-0 bg-white pointer-events-none" [class.opacity-0]="isLoggedIn"></div>
    </div>
  </div>

  <!-- Top Navigation (Logo + Links) -->
  <nav id="main-nav" class="fixed top-0 left-0 w-full px-4 py-6 flex justify-center items-center gap-6 md:gap-14 z-[1000] bg-gradient-to-b from-black/80 to-transparent transition-opacity duration-500"
       [ngClass]="isLoggedIn ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'">
    
    <!-- Links Izquierda -->
    <div class="hidden md:flex items-center gap-10 text-white/80 font-black text-[0.65rem] tracking-[4px] uppercase drop-shadow-md">
      <a href="#nosotros" class="hover:text-[#d1b88e] hover:-translate-y-1 transition-all duration-300">Nosotros</a>
      <a href="#catalogo-section" class="hover:text-[#d1b88e] hover:-translate-y-1 transition-all duration-300">Carta</a>
      <a href="#eventos" class="hover:text-[#d1b88e] hover:-translate-y-1 transition-all duration-300">Tienda</a>
    </div>
    
    <!-- Logo Central -->
    <div class="relative group cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      <div class="absolute inset-0 bg-[#d1b88e] blur-md opacity-20 group-hover:opacity-60 transition-opacity duration-500 rounded-full"></div>
      <img src="/assets/images/museo/logo-cafe.png" class="relative w-14 h-14 md:w-16 md:h-16 object-cover rounded-full opacity-90 border-2 border-transparent group-hover:border-[#d1b88e] group-hover:scale-105 transition-all duration-500 shadow-lg" alt="Museo"/>
    </div>
    
    <!-- Links Derecha -->
    <div class="hidden md:flex items-center gap-10 text-white/80 font-black text-[0.65rem] tracking-[4px] uppercase drop-shadow-md">
      <button (click)="toggleMapa()" class="hover:text-[#d1b88e] hover:-translate-y-1 transition-all duration-300">Ubicación</button>
      <a href="/login" class="hover:text-[#d1b88e] hover:-translate-y-1 transition-all duration-300">Mi Club</a>
      <a href="/carrito" class="border border-white/20 hover:border-[#d1b88e] hover:bg-[#d1b88e]/10 hover:text-[#d1b88e] rounded-full px-5 py-2 transition-all duration-300 flex items-center gap-2">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>
        Carrito
      </a>
    </div>
  </nav>

  <div id="hero-ui" class="fixed inset-0 z-10 flex flex-col items-center justify-center px-6 transition-opacity duration-500"
       [ngClass]="isLoggedIn ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'">
    
    <h1 class="text-white text-6xl md:text-8xl font-black tracking-tighter text-center uppercase drop-shadow-[0_10px_30px_rgba(0,0,0,0.9)] leading-none mb-4">
      CAFÉ<br>AYACUCHANO
    </h1>
    <p class="text-white/80 text-lg font-medium tracking-widest text-center drop-shadow-md mb-10">
      "MÁS QUE UN CAFÉ..."
    </p>
    
    <button (click)="toggleMapa()" class="pointer-events-auto bg-[#d1b88e]/20 backdrop-blur-xl border border-white/20 text-white hover:bg-[#d1b88e] hover:text-black hover:scale-105 transition-all duration-500 rounded-full px-10 py-5 flex items-center justify-center text-sm font-black tracking-[3px] shadow-[0_15px_35px_rgba(0,0,0,0.5)]">
      <i class="fas fa-map-marker-alt mr-3 text-lg"></i> ENCUÉNTRANOS
    </button>

    <footer class="absolute bottom-10 flex flex-col items-center">
      <span class="text-[#d1b88e] font-bold tracking-[6px] uppercase text-xs md:text-sm drop-shadow-lg mb-4">
        TUESTE DE AUTOR • VRAEM
      </span>
      <div class="flex items-center gap-4 text-white/40 text-xs font-bold tracking-[3px]">
        <span>MAR - SÁB: 9AM - 7:30PM</span>
        <span>•</span>
        <span>DOM: 3:30PM - 7PM</span>
      </div>
    </footer>
  </div>

  <div class="fixed inset-0 z-[9999] flex items-center justify-center transition-all duration-300 opacity-0 invisible pointer-events-none"
       [ngClass]="{ '!opacity-100 !visible !pointer-events-auto': mapaActivo }">
    
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm cursor-pointer" (click)="toggleMapa()"></div>
    
    <div class="relative bg-[#0a0a0a] border border-white/10 p-5 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.9)] w-[85%] max-w-[340px] transform transition-transform duration-300 ease-out scale-95 translate-y-8"
         [ngClass]="{ '!scale-100 !translate-y-0': mapaActivo }">
      
      <button class="absolute -top-3 -right-3 w-10 h-10 bg-[#d1b88e] text-black border-none rounded-full font-black text-xl flex items-center justify-center shadow-lg hover:scale-110 hover:bg-white transition-all cursor-pointer z-10" (click)="toggleMapa()">
        &times;
      </button>

      <h3 class="text-[#d1b88e] font-black text-lg mb-4 m-0 uppercase tracking-[1px] text-center">UBICACIÓN</h3>
      
      <a href="https://www.google.com/maps/place/Cactus+Museo+Ayacucho/@-13.1564479,-74.2018571,20.75z/data=!4m15!1m8!3m7!1s0x91127d88f5b2bee9:0xe9b3cb843a70a16e!2sAyacucho!3b1!8m2!3d-13.1638737!4d-74.2235641!16zL20vMDJwZ252!3m5!1s0x9112870070ca3657:0x33920fa99e15b74f!8m2!3d-13.1565313!4d-74.2017623!16s%2Fg%2F11x2kz1ckw!5m1!1e4?hl=es&entry=ttu&g_ep=EgoyMDI2MDkyOC4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="block relative w-full h-[200px] overflow-hidden rounded-xl filter grayscale-[30%] hover:grayscale-0 transition-all duration-500 border border-white/10">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31061.04285149372!2d-74.23862214482729!3d-13.15414002766023!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91127d75df0709b1%3A0xcb065ec016b8d41a!2sAyacucho!5e0!3m2!1ses!2spe!4v1713835000000!5m2!1ses!2spe" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </a>
      
      <div class="text-white/80 text-center mt-4 text-[0.7rem] font-bold tracking-[2px] uppercase">
        Jr. San Cristóbal, Ayacucho
      </div>
    </div>
  </div>

  @if (!isLoggedIn) {
    <div class="scroll-trigger-zone h-[150vh] w-full relative z-0"></div>
  }

  <div class="relative z-30 bg-[#050505] shadow-[0_-20px_50px_rgba(0,0,0,0.9)]">
    <app-about></app-about>
    <div id="catalogo-section">
      <app-catalog></app-catalog>
    </div>
    <app-footer></app-footer>
  </div>
</main>
